{% extends "base.html" %}
{% block page_title %}{{ 'Edit User' if mode == 'edit' else 'Add User' }}{% endblock %}
{% block content %}

<div class="panel">
    <div class="panel-header">
        <h2>{{ 'Edit User' if mode == 'edit' else 'Add a new user' }}</h2>
    </div>
    <form method="POST" class="stacked-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ form_data.get('full_name', '') }}" required autofocus>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ form_data.get('username', '') }}"
               {{ 'readonly' if mode == 'edit' else 'required' }}>
        {% if mode == 'edit' %}
        <p class="field-hint">Username can't be changed after creation.</p>
        {% endif %}

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ form_data.get('email', '') }}">

        <label for="role">Role</label>
        <select id="role" name="role" required>
            <option value="" disabled {{ 'selected' if not form_data.get('role') else '' }}>Select a role…</option>
            {% for r in ['Admin', 'Faculty', 'Student'] %}
            <option value="{{ r }}" {{ 'selected' if form_data.get('role') == r else '' }}>{{ r }}</option>
            {% endfor %}
        </select>

        <label for="password">{{ 'New Password (leave blank to keep current)' if mode == 'edit' else 'Password' }}</label>
        <input type="password" id="password" name="password" {{ '' if mode == 'edit' else 'required' }}>

        <div class="form-actions" style="display:flex; gap:10px; margin-top:8px;">
            <a href="{{ url_for('team') }}" class="btn-ghost">Cancel</a>
            <button type="submit" class="btn-primary">{{ 'Save Changes' if mode == 'edit' else 'Create User' }}</button>
        </div>
    </form>
</div>

{% endblock %}
