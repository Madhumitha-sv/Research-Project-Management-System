{% extends "base.html" %}
{% block content %}

<div class="page-eyebrow">Workspace</div>
<h1>Projects</h1>
<p>Every research project you have access to, across all views.</p>
<hr>

<div class="panel">
    <div class="view-toolbar">
        <div class="toolbar-left">
            <span class="panel-title">All Projects</span>

            <div class="view-picker" id="viewPicker">
                <button type="button" class="view-trigger" id="viewTrigger" aria-haspopup="listbox" aria-expanded="false">
                    <svg class="vt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                    <span id="viewTriggerLabel">Grid</span>
                    <svg class="vt-caret" width="10" height="10" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 1l5 5 5-5"/></svg>
                </button>

                <div class="view-menu" id="viewMenu" role="listbox">
                    <button type="button" class="view-option is-active" data-view="grid" role="option">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                        <span><strong>Grid</strong><small>Spreadsheet-style rows</small></span>
                    </button>
                    <button type="button" class="view-option" data-view="gantt" role="option">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="14" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="6" y1="18" x2="16" y2="18"/></svg>
                        <span><strong>Gantt</strong><small>Timeline of durations</small></span>
                    </button>
                    <button type="button" class="view-option" data-view="board" role="option">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="14" rx="1"/></svg>
                        <span><strong>Board</strong><small>Grouped by status</small></span>
                    </button>
                    <button type="button" class="view-option" data-view="calendar" role="option">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
                        <span><strong>Calendar</strong><small>By month, on due dates</small></span>
                    </button>
                </div>
            </div>

            <div class="toolbar-search">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="projSearch" placeholder="Filter projects…">
            </div>

            <select id="statusFilter" class="toolbar-select">
                <option value="">All statuses</option>
                <option value="Active">Active</option>
                <option value="On Hold">On Hold</option>
                <option value="Completed">Completed</option>
            </select>
        </div>

        {% if can_create %}
        <a href="{{ url_for('new_project') }}" class="btn-primary btn-sm">+ New Project</a>
        {% endif %}
    </div>

    <div id="viewRoot" class="view-root"></div>
</div>

<script id="projectData" type="application/json">{{ projects|tojson }}</script>
<script>
(function () {
    const DATA = JSON.parse(document.getElementById('projectData').textContent);
    const root = document.getElementById('viewRoot');
    const picker = document.getElementById('viewPicker');
    const trigger = document.getElementById('viewTrigger');
    const menu = document.getElementById('viewMenu');
    const triggerLabel = document.getElementById('viewTriggerLabel');
    const searchInput = document.getElementById('projSearch');
    const statusFilter = document.getElementById('statusFilter');

    let currentView = 'grid';

    const STATUS_CLASS = {
        'Active': 'st-active',
        'On Hold': 'st-hold',
        'Completed': 'st-done'
    };

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const initials = name => (name || '?').trim().charAt(0).toUpperCase();

    function fmtShort(d) {
        if (!d) return '—';
        const dt = new Date(d + 'T00:00:00');
        if (isNaN(dt)) return '—';
        return dt.toLocaleDateString(undefined, { day: '2-digit', month: 'short' });
    }

    function visibleData() {
        const q = searchInput.value.trim().toLowerCase();
        const st = statusFilter.value;
        return DATA.filter(p => {
            if (st && p.status !== st) return false;
            if (!q) return true;
            return (p.title + ' ' + p.description + ' ' + p.owner).toLowerCase().includes(q);
        });
    }

    function avatarStack(members) {
        if (!members.length) return '<span class="muted-dash">—</span>';
        const shown = members.slice(0, 3);
        const extra = members.length - shown.length;
        return '<div class="avatar-stack">' +
            shown.map(m => `<span class="stack-av" title="${esc(m)}">${esc(initials(m))}</span>`).join('') +
            (extra > 0 ? `<span class="stack-av stack-more">+${extra}</span>` : '') +
            '</div>';
    }

    function statusChip(status) {
        return `<span class="status-chip ${STATUS_CLASS[status] || ''}"><span class="chip-dot"></span>${esc(status)}</span>`;
    }

    function progressBar(pct, done, total) {
        return `<div class="progress-cell">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <span class="progress-num">${pct}%</span>
            <span class="progress-sub">${done}/${total}</span>
        </div>`;
    }

    // ---------------- GRID ----------------
    function renderGrid(rows) {
        if (!rows.length) return emptyState('No projects match your filters.');
        return `<div class="table-scroll"><table class="sheet-table">
            <thead><tr>
                <th class="col-title">Project</th>
                <th>Description</th>
                <th>Owner</th>
                <th>Status</th>
                <th>Start</th>
                <th>Due</th>
                <th>Team</th>
                <th class="col-progress">Progress</th>
            </tr></thead>
            <tbody>
            ${rows.map(p => `
                <tr class="sheet-row ${STATUS_CLASS[p.status] || ''}" onclick="window.location='${p.url}'">
                    <td class="col-title"><a href="${p.url}" class="row-link">${esc(p.title)}</a></td>
                    <td class="cell-desc">${esc(p.description) || '<span class="muted-dash">—</span>'}</td>
                    <td><span class="owner-cell"><span class="stack-av">${esc(initials(p.owner))}</span>${esc(p.owner)}</span></td>
                    <td>${statusChip(p.status)}</td>
                    <td class="cell-date">${fmtShort(p.start_date)}</td>
                    <td class="cell-date">${fmtShort(p.end_date)}</td>
                    <td>${avatarStack(p.members)}</td>
                    <td class="col-progress">${progressBar(p.progress, p.task_done, p.task_total)}</td>
                </tr>`).join('')}
            </tbody></table></div>`;
    }

    // ---------------- GANTT ----------------
    function renderGantt(rows) {
        const dated = rows.filter(p => p.start_date && p.end_date);
        if (!dated.length) return emptyState('No projects have both a start and due date yet.');

        let min = Infinity, max = -Infinity;
        dated.forEach(p => {
            min = Math.min(min, new Date(p.start_date + 'T00:00:00').getTime());
            max = Math.max(max, new Date(p.end_date + 'T00:00:00').getTime());
        });
        const span = Math.max(max - min, 86400000);

        // month ticks
        const ticks = [];
        const cur = new Date(min); cur.setDate(1);
        while (cur.getTime() <= max) {
            const left = ((cur.getTime() - min) / span) * 100;
            if (left >= 0 && left <= 100) {
                ticks.push(`<div class="gantt-tick" style="left:${left}%"><span>${cur.toLocaleDateString(undefined,{month:'short',year:'2-digit'})}</span></div>`);
            }
            cur.setMonth(cur.getMonth() + 1);
        }

        const todayPct = ((Date.now() - min) / span) * 100;
        const todayMark = (todayPct >= 0 && todayPct <= 100)
            ? `<div class="gantt-today" style="left:${todayPct}%"></div>` : '';

        const undated = rows.length - dated.length;

        return `<div class="gantt-wrap">
            <div class="gantt-head">
                <div class="gantt-label-col">Project</div>
                <div class="gantt-track-col">${ticks.join('')}</div>
            </div>
            <div class="gantt-body">
                ${todayMark}
                ${dated.map(p => {
                    const s = new Date(p.start_date + 'T00:00:00').getTime();
                    const e = new Date(p.end_date + 'T00:00:00').getTime();
                    const left = ((s - min) / span) * 100;
                    const width = Math.max(((e - s) / span) * 100, 1.5);
                    return `<div class="gantt-row">
                        <div class="gantt-label-col"><a href="${p.url}" class="row-link">${esc(p.title)}</a></div>
                        <div class="gantt-track-col">
                            <div class="gantt-bar ${STATUS_CLASS[p.status] || ''}" style="left:${left}%;width:${width}%" title="${esc(p.title)} · ${p.start_date} → ${p.end_date}">
                                <div class="gantt-bar-fill" style="width:${p.progress}%"></div>
                                <span class="gantt-bar-text">${p.progress}%</span>
                            </div>
                        </div>
                    </div>`;
                }).join('')}
            </div>
            ${undated ? `<div class="gantt-note">${undated} project${undated>1?'s':''} hidden — missing start or due date.</div>` : ''}
        </div>`;
    }

    // ---------------- BOARD ----------------
    function renderBoard(rows) {
        const cols = ['Active', 'On Hold', 'Completed'];
        return `<div class="board-wrap">
            ${cols.map(col => {
                const items = rows.filter(p => p.status === col);
                return `<div class="board-col">
                    <div class="board-col-head ${STATUS_CLASS[col]}">
                        <span class="chip-dot"></span>${col}
                        <span class="board-count">${items.length}</span>
                    </div>
                    <div class="board-col-body">
                        ${items.length ? items.map(p => `
                            <a href="${p.url}" class="board-card ${STATUS_CLASS[col]}">
                                <div class="bc-title">${esc(p.title)}</div>
                                ${p.description ? `<div class="bc-desc">${esc(p.description)}</div>` : ''}
                                <div class="bc-meta">
                                    <span class="stack-av">${esc(initials(p.owner))}</span>
                                    <span class="bc-date">${fmtShort(p.end_date)}</span>
                                </div>
                                <div class="progress-track bc-progress"><div class="progress-fill" style="width:${p.progress}%"></div></div>
                            </a>`).join('')
                        : '<div class="board-empty">Nothing here</div>'}
                    </div>
                </div>`;
            }).join('')}
        </div>`;
    }

    // ---------------- CALENDAR ----------------
    let calRef = new Date();

    function renderCalendar(rows) {
        const year = calRef.getFullYear(), month = calRef.getMonth();
        const first = new Date(year, month, 1);
        const startDow = first.getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const byDay = {};
        rows.forEach(p => {
            if (!p.end_date) return;
            const d = new Date(p.end_date + 'T00:00:00');
            if (d.getFullYear() === year && d.getMonth() === month) {
                (byDay[d.getDate()] = byDay[d.getDate()] || []).push(p);
            }
        });

        const cells = [];
        for (let i = 0; i < startDow; i++) cells.push('<div class="cal-cell cal-blank"></div>');
        const today = new Date();
        for (let d = 1; d <= daysInMonth; d++) {
            const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
            const items = byDay[d] || [];
            cells.push(`<div class="cal-cell${isToday ? ' cal-today' : ''}">
                <div class="cal-daynum">${d}</div>
                ${items.map(p => `<a href="${p.url}" class="cal-event ${STATUS_CLASS[p.status] || ''}" title="${esc(p.title)}">${esc(p.title)}</a>`).join('')}
            </div>`);
        }

        return `<div class="cal-wrap">
            <div class="cal-head">
                <button type="button" class="cal-nav" data-cal="-1">‹</button>
                <span class="cal-month">${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span>
                <button type="button" class="cal-nav" data-cal="1">›</button>
                <span class="cal-hint">Projects shown on their due date</span>
            </div>
            <div class="cal-grid cal-dow">
                ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow-cell">${d}</div>`).join('')}
            </div>
            <div class="cal-grid">${cells.join('')}</div>
        </div>`;
    }

    function emptyState(msg) {
        return `<div class="empty-state"><h3>Nothing to show</h3><p>${esc(msg)}</p></div>`;
    }

    function render() {
        const rows = visibleData();
        if (currentView === 'grid') root.innerHTML = renderGrid(rows);
        else if (currentView === 'gantt') root.innerHTML = renderGantt(rows);
        else if (currentView === 'board') root.innerHTML = renderBoard(rows);
        else root.innerHTML = renderCalendar(rows);

        root.querySelectorAll('[data-cal]').forEach(btn => {
            btn.addEventListener('click', () => {
                calRef.setMonth(calRef.getMonth() + parseInt(btn.dataset.cal, 10));
                render();
            });
        });
    }

    // view picker behaviour
    trigger.addEventListener('click', e => {
        e.stopPropagation();
        const open = picker.classList.toggle('open');
        trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    document.addEventListener('click', () => {
        picker.classList.remove('open');
        trigger.setAttribute('aria-expanded', 'false');
    });

    menu.addEventListener('click', e => {
        const opt = e.target.closest('.view-option');
        if (!opt) return;
        currentView = opt.dataset.view;
        menu.querySelectorAll('.view-option').forEach(o => o.classList.toggle('is-active', o === opt));
        triggerLabel.textContent = opt.querySelector('strong').textContent;
        trigger.querySelector('.vt-icon').innerHTML = opt.querySelector('svg').innerHTML;
        picker.classList.remove('open');
        render();
    });

    searchInput.addEventListener('input', render);
    statusFilter.addEventListener('change', render);

    render();
})();
</script>

{% endblock %}
