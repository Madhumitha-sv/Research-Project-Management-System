{% extends "base.html" %}
{% block page_title %}New Task{% endblock %}
{% block content %}

<div class="panel">
    <div class="panel-header">
        <h2>New task for {{ project.title }}</h2>
    </div>
    <form method="POST" action="{{ url_for('new_task', project_id=project.project_id) }}" class="stacked-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="title">Title</label>
        <input type="text" id="title" name="title" required autofocus>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4"></textarea>

        <label for="assigned_to">Assign to</label>
        <select id="assigned_to" name="assigned_to">
            <option value="">Unassigned</option>
            {% for m in members %}
            <option value="{{ m.user_id }}">{{ m.full_name }} ({{ m.role }})</option>
            {% endfor %}
        </select>

        <label for="due_date">Due date</label>
        <input type="date" id="due_date" name="due_date">

        <button type="submit" class="btn-primary">Create task</button>
    </form>
</div>

{% endblock %}
