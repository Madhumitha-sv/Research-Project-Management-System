{% extends "base.html" %}
{% block page_title %}New Task{% endblock %}
{% block content %}

<div class="panel form-panel">
    <p class="welcome-line">For project: <strong>{{ project['title'] }}</strong></p>

    <form method="POST" class="stack-form">
        <label for="title">Task Title</label>
        <input type="text" id="title" name="title" required autofocus>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4"></textarea>

        <div class="form-row">
            <div>
                <label for="assigned_to">Assign To</label>
                <select id="assigned_to" name="assigned_to">
                    <option value="">Unassigned</option>
                    {% for m in members %}
                    <option value="{{ m['user_id'] }}">{{ m['full_name'] }}</option>
                    {% endfor %}
                </select>
                {% if not members %}
                <p class="field-hint">No members on this project yet — add members from the project page first.</p>
                {% endif %}
            </div>
            <div>
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date">
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('project_detail', project_id=project['project_id']) }}" class="btn-ghost">Cancel</a>
            <button type="submit" class="btn-primary">Create Task</button>
        </div>
    </form>
</div>

{% endblock %}
