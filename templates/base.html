<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Project Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    {% if session.get('user') %}
    <div class="app-layout">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="brand-mark">RP</span>
                <span class="brand-name">ResearchOps</span>
            </div>

            <nav class="sidebar-nav">
                <a href="{{ url_for('dashboard') }}"
                   class="nav-item {{ 'is-active' if request.endpoint == 'dashboard' else '' }}">
                    <span class="nav-icon">⌂</span> Dashboard
                </a>
                <a href="{{ url_for('projects') }}"
                   class="nav-item {{ 'is-active' if request.endpoint in ['projects','project_detail','new_project'] else '' }}">
                    <span class="nav-icon">▣</span> Projects
                </a>
                <a href="{{ url_for('tasks') }}"
                   class="nav-item {{ 'is-active' if request.endpoint in ['tasks','new_task'] else '' }}">
                    <span class="nav-icon">☑</span> Tasks
                </a>
                <a href="#" class="nav-item is-disabled">
                    <span class="nav-icon">◎</span> Team <span class="soon-tag">Soon</span>
                </a>
                <a href="#" class="nav-item is-disabled">
                    <span class="nav-icon">⚙</span> Settings <span class="soon-tag">Soon</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-chip">
                    <span class="avatar">{{ session['user']['full_name'][0] }}</span>
                    <div class="user-chip-info">
                        <span class="user-chip-name">{{ session['user']['full_name'] }}</span>
                        <span class="role-badge role-{{ session['user']['role']|lower }}">{{ session['user']['role'] }}</span>
                    </div>
                </div>
                <a href="{{ url_for('logout') }}" class="logout-btn">Log out</a>
            </div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div class="topbar-title">
                    <span class="eyebrow">Overview</span>
                    <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
                </div>
            </header>

            <main class="content">
